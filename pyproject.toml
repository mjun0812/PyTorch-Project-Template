[project]
name = "pytorch-project-template"
version = "6.0.0"
description = ""
authors = [{ name = "Junya Morioka", email = "mjun@mjunya.com" }]
requires-python = ">=3.11"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "mlflow>=3.1.0",
    "torchmetrics>=1.4.1",
    "tqdm>=4.66.5",
    "matplotlib>=3.9.2",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.1",
    "torchinfo>=1.8.0",
    "einops>=0.8.0",
    "loguru>=0.7.2",
    "pandas>=2.2.2",
    "tabulate>=0.9.0",
    "natsort>=8.4.0",
    "wandb>=0.17.7",
    "schedulefree>=1.4",
    "jupyter>=1.1.1",
    "timm>=1.0.15",
]

[dependency-groups]
doc = [
    "furo>=2024.8.6",
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-autoapi>=3.6.0",
    "sphinx-autobuild>=2024.10.3",
]
dev = ["mypy>=1.16.0", "pre-commit>=4.2.0", "pytest>=8.3.2", "ruff>=0.17.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pyright]
typeCheckingMode = "off"
exclude = ["dataset", "result", ".tmp", ".git", ".venv", ".vscode"]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
torch = [
    { index = "torch-cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "torch-cpu", marker = "sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')" },
]
torchvision = [
    { index = "torch-cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "torch-cpu", marker = "sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')" },
]

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "dataset",
    "result",
    "*.ipynb",
]

[tool.ruff.lint]
preview = true
select = [
    "ANN", # type annotation
    "B",   # flake8-bugbear
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "PTH", # use `pathlib.Path` instead of `os.path`
    "RUF", # ruff specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D1", # Missing docstring in public module, class, function, or method
    "any-type",
    "unused-loop-control-variable",
    "function-call-in-default-argument",
    "zip-without-explicit-strict",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "incorrect-blank-line-before-class", # D211 is prioritized in pydocstyle convention 'google'
    "missing-blank-line-after-summary",
    "multi-line-summary-first-line",
    "multi-line-summary-second-line",
    "missing-trailing-period",
    "missing-terminal-punctuation",
    "indentation-with-invalid-multiple-comment",
    "logging-f-string",
    "single-line-implicit-string-concatenation",
    "multi-line-implicit-string-concatenation",
    "builtin-open",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-comment",
    "suppressible-exception",
    "if-else-block-instead-of-if-exp",
    "if-else-block-instead-of-dict-lookup",
]
unfixable = ["unused-import", "unused-variable"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules call import_submodules() so that importing a package registers its submodules.
"__init__.py" = ["unused-import", "non-empty-init-module"]

[tool.ruff.lint.pydocstyle]
convention = "google"
